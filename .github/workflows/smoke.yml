name: Smoke test

on:
  workflow_dispatch:

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: bash ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell monkey -p com.kieronquinn.app.ambientmusicmod -c android.intent.category.LAUNCHER 1
            sleep 20
            adb logcat -d -b crash > crash.txt || true
            adb logcat -d -v brief AndroidRuntime:E '*:S' > runtime.txt || true
            echo "===== crash buffer ====="; cat crash.txt
            echo "===== AndroidRuntime ====="; cat runtime.txt
            adb shell pidof com.kieronquinn.app.ambientmusicmod && echo "APP STILL RUNNING" || echo "APP NOT RUNNING"
